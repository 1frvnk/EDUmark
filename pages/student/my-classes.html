<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Classes | EduMark</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-logo">EduMark</div>
    <div class="sidebar-role">Student</div>

    <nav>
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="my-classes.html" class="nav-link active">My Classes</a>
      <a href="attendance.html" class="nav-link">Attendance</a>
      <a href="scan.html" class="nav-link">Scan QR</a>
    </nav>

    <button class="btn btn-danger" id="logoutBtn">Logout</button>
  </aside>

  <main class="main">

    <header class="topbar">
      <h2>My Classes</h2>
    </header>

    <section class="content">

      <div class="card">
        <h3>Class Information</h3>
        <div id="studentInfo">Loading student information...</div>
        <div id="messageBox"></div>
      </div>

      <div class="card">
        <h3>My Enrolled Classes</h3>

        <div class="table-wrap">
          <table style="width:100%; border-collapse:collapse;">
            <thead>
              <tr>
                <th>Class Name</th>
                <th>Subject</th>
                <th>Class ID</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody id="classesTable">
              <tr>
                <td colspan="4">Loading classes...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </section>

  </main>

</div>

<script type="module">

import { auth, db } from "../../js/firebase-config.js";

import {
  guardPage,
  attachLogout
} from "../../js/auth.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  collection,
  query,
  where,
  getDocs,
  getDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

guardPage("student");
attachLogout();

const classesTable = document.getElementById("classesTable");
const studentInfo = document.getElementById("studentInfo");
const messageBox = document.getElementById("messageBox");

let loading = false;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function showMessage(message, type = "success") {
  messageBox.innerHTML = `
    <div class="alert">
      ${escapeHTML(message)}
    </div>
  `;

  messageBox.style.color =
    type === "error" ? "#b91c1c" : "#15803d";
}

async function loadClasses(user) {

  if (loading) return;
  loading = true;

  classesTable.innerHTML = `
    <tr><td colspan="4">Loading your classes...</td></tr>
  `;

  try {

    // GET STUDENT PROFILE
    const studentRef = doc(db, "users", user.uid);
    const studentSnapshot = await getDoc(studentRef);

    if (!studentSnapshot.exists()) {
      throw new Error("Student profile not found.");
    }

    const student = studentSnapshot.data();

    if (student.role !== "student") {
      throw new Error("This page is only available to students.");
    }

    studentInfo.innerHTML = `
      <p><strong>Name:</strong> ${escapeHTML(student.name || "N/A")}</p>
      <p><strong>Student ID:</strong> ${escapeHTML(student.studentId || "N/A")}</p>
      <p><strong>Programme:</strong> ${escapeHTML(student.programmeId || "N/A")}</p>
      <p><strong>Level:</strong> ${escapeHTML(student.levelId || "N/A")}</p>
    `;

    // COLLECT CLASS IDS FROM STUDENT PROFILE
    const classIds = new Set(
      Array.isArray(student.classIds) ? student.classIds : []
    );

    // ALSO FIND CLASSES WHERE STUDENT UID IS IN studentIds
    const enrolledQuery = query(
      collection(db, "classes"),
      where("studentIds", "array-contains", user.uid)
    );

    const enrolledSnapshot = await getDocs(enrolledQuery);

    enrolledSnapshot.forEach(classDoc => {
      classIds.add(classDoc.id);
    });

    if (classIds.size === 0) {

      classesTable.innerHTML = `
        <tr>
          <td colspan="4">
            You have not been assigned to any classes yet.
          </td>
        </tr>
      `;

      return;
    }

    // FETCH ALL CLASSES
    const classResults = await Promise.all(
      [...classIds].map(async classId => {

        const classSnapshot = await getDoc(
          doc(db, "classes", classId)
        );

        if (!classSnapshot.exists()) {
          return null;
        }

        return {
          id: classSnapshot.id,
          ...classSnapshot.data()
        };

      })
    );

    const validClasses = classResults.filter(Boolean);

    if (!validClasses.length) {

      classesTable.innerHTML = `
        <tr>
          <td colspan="4">
            No valid class records were found.
          </td>
        </tr>
      `;

      return;
    }

    renderClasses(validClasses);

  } catch (error) {

    console.error("Classes load error:", error);

    classesTable.innerHTML = `
      <tr>
        <td colspan="4">
          Unable to load your classes.
        </td>
      </tr>
    `;

    showMessage(error.message, "error");

  } finally {
    loading = false;
  }

}

function renderClasses(classes) {

  classesTable.innerHTML = classes.map(item => {

    const className =
      item.name ||
      item.className ||
      item.title ||
      "Unnamed Class";

    const subject =
      item.subject ||
      item.description ||
      "N/A";

    return `
      <tr>
        <td>${escapeHTML(className)}</td>
        <td>${escapeHTML(subject)}</td>
        <td>${escapeHTML(item.id)}</td>
        <td><span class="badge">Enrolled</span></td>
      </tr>
    `;

  }).join("");

}

// WAIT FOR FIREBASE AUTHENTICATION
onAuthStateChanged(auth, user => {

  if (!user) return;

  loadClasses(user);

});

</script>

</body>
</html>
