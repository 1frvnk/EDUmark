<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduMark – Student Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />

  <style>
    .recent-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-top: 1.2rem;
    }

    @media (max-width: 860px) {
      .recent-grid { grid-template-columns: 1fr; }
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: .8rem;
    }

    .section-header h2 { font-size: 1rem; }

    .activity-list {
      display: flex;
      flex-direction: column;
      gap: .6rem;
    }

    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: .8rem;
      padding: .6rem 0;
      border-bottom: 1px solid var(--border);
    }

    .activity-item:last-child { border-bottom: none; }

    .activity-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .9rem;
      flex-shrink: 0;
    }

    .activity-text {
      font-size: .88rem;
      line-height: 1.4;
    }

    .activity-time {
      font-size: .78rem;
      color: var(--grey);
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .8rem;
      margin-top: 1.2rem;
    }

    .quick-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      padding: 1rem .5rem;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      text-decoration: none;
      color: var(--dark);
      font-size: .85rem;
      font-weight: 500;
      transition: border-color var(--transition), background var(--transition);
    }

    .quick-btn:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
    }

    .quick-btn .icon { font-size: 1.5rem; }

    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--dark);
    }

    @media (max-width: 768px) {
      .hamburger { display: block; }
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 99;
    }

    .overlay.show { display: block; }
  </style>
</head>

<body>
<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">Edu<span>Mark</span></div>
    <div class="sidebar-role">Student Panel</div>

    <nav>
      <a href="dashboard.html" class="nav-link active">
        <span class="nav-icon">🏠</span> Dashboard
      </a>

      <a href="scan.html" class="nav-link">
        <span class="nav-icon">📷</span> Scan QR
      </a>

      <a href="attendance.html" class="nav-link">
        <span class="nav-icon">📋</span> My Attendance
      </a>

      <a href="my-classes.html" class="nav-link">
        <span class="nav-icon">📚</span> My Classes
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-full" id="logoutBtn"
        style="color:rgba(255,255,255,.6);justify-content:flex-start;gap:.6rem;">
        🚪 Logout
      </button>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <div class="main">

    <div class="topbar">
      <div style="display:flex;align-items:center;gap:.8rem;">
        <button class="hamburger" id="hamburger">☰</button>
        <span class="topbar-title">Dashboard</span>
      </div>

      <span class="topbar-user" id="topbarUser">Loading…</span>
    </div>

    <div class="content">

      <div class="stats-grid">

        <div class="stat-card">
          <div class="stat-icon">📚</div>
          <div class="stat-label">Enrolled Classes</div>
          <div class="stat-value" id="statClasses">—</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-label">Sessions Attended</div>
          <div class="stat-value" id="statAttended">—</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">📊</div>
          <div class="stat-label">Attendance Rate</div>
          <div class="stat-value" id="statRate">—</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">📡</div>
          <div class="stat-label">Live Session</div>
          <div class="stat-value" id="statLive">—</div>
        </div>

      </div>

      <div class="recent-grid">

        <div class="card">
          <h2>Quick Actions</h2>

          <div class="quick-actions">
            <a href="scan.html" class="quick-btn">
              <span class="icon">📷</span>
              Scan QR
            </a>

            <a href="attendance.html" class="quick-btn">
              <span class="icon">📋</span>
              My Attendance
            </a>
          </div>
        </div>

        <div class="card">
          <div class="section-header">
            <h2>Recent Attendance</h2>
            <a href="attendance.html" style="font-size:.83rem;">View all →</a>
          </div>

          <div class="activity-list" id="recentAttendance">
            <p class="text-grey" style="font-size:.88rem;">Loading…</p>
          </div>
        </div>

      </div>

      <div class="card mt-2">
        <div class="section-header">
          <h2>My Classes</h2>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Class</th>
                <th>Teacher</th>
              </tr>
            </thead>

            <tbody id="myClassesBody">
              <tr>
                <td colspan="2" class="text-grey">Loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script type="module">

  import { auth, db } from "../../js/firebase-config.js";
  import { guardPage, attachLogout } from "../../js/auth.js";

  import {
    collection,
    getDocs,
    query,
    where,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";


  guardPage("student");
  attachLogout("logoutBtn");


  // MOBILE NAVIGATION

  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");

  document.getElementById("hamburger").addEventListener("click", () => {
    sidebar.classList.toggle("open");
    overlay.classList.toggle("show");
  });

  overlay.addEventListener("click", () => {
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
  });


  // CACHES

  const classCache = {};
  const teacherCache = {};

  async function getClass(classId) {
    if (!classId) return null;

    if (Object.prototype.hasOwnProperty.call(classCache, classId)) {
      return classCache[classId];
    }

    const snap = await getDoc(doc(db, "classes", classId));

    classCache[classId] = snap.exists() ? snap.data() : null;

    return classCache[classId];
  }


  async function getTeacherName(teacherId) {
    if (!teacherId) return "—";

    if (teacherCache[teacherId]) {
      return teacherCache[teacherId];
    }

    const snap = await getDoc(doc(db, "users", teacherId));

    const name = snap.exists()
      ? (snap.data().name || snap.data().email || "—")
      : "—";

    teacherCache[teacherId] = name;

    return name;
  }


  // AUTHENTICATION

  onAuthStateChanged(auth, async (user) => {

    if (!user) return;

    try {

      const snap = await getDoc(doc(db, "users", user.uid));

      if (!snap.exists() || snap.data().role !== "student") {
        document.getElementById("topbarUser").textContent =
          "Student profile unavailable";

        document.getElementById("myClassesBody").innerHTML = `
          <tr>
            <td colspan="2" class="text-grey">
              Student profile not found. Contact your administrator.
            </td>
          </tr>
        `;

        return;
      }

      const studentData = snap.data();

      document.getElementById("topbarUser").textContent =
        studentData.name || user.email || "Student";

      const classIds = Array.isArray(studentData.classIds)
        ? [...new Set(studentData.classIds.filter(Boolean))]
        : [];

      await loadClasses(classIds, user.uid);

      await loadAttendance(user.uid, classIds);

    } catch (error) {

      console.error("Student dashboard error:", error);

      document.getElementById("myClassesBody").innerHTML = `
        <tr>
          <td colspan="2" class="text-grey">
            Unable to load dashboard information.
          </td>
        </tr>
      `;

    }

  });


  // LOAD CLASSES

  async function loadClasses(classIds, uid) {

    const statClasses = document.getElementById("statClasses");
    const tbody = document.getElementById("myClassesBody");

    try {

      // Also check class documents that list the student in studentIds.
      const enrolledQuery = query(
        collection(db, "classes"),
        where("studentIds", "array-contains", uid)
      );

      const enrolledSnapshot = await getDocs(enrolledQuery);

      const enrolledIds = new Set(classIds);

      enrolledSnapshot.forEach(classDoc => {
        enrolledIds.add(classDoc.id);
        classCache[classDoc.id] = classDoc.data();
      });

      const allClassIds = [...enrolledIds];

      statClasses.textContent = allClassIds.length;

      if (!allClassIds.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="2" class="text-grey">
              Not enrolled in any classes yet.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = "";

      for (const classId of allClassIds) {

        const c = await getClass(classId);

        if (!c) continue;

        const teacherName = await getTeacherName(c.teacherId);

        const row = document.createElement("tr");

        const classCell = document.createElement("td");
        const strong = document.createElement("strong");

        strong.textContent = c.className || "Unnamed Class";
        classCell.appendChild(strong);

        const teacherCell = document.createElement("td");
        teacherCell.style.color = "var(--grey)";
        teacherCell.textContent = teacherName;

        row.appendChild(classCell);
        row.appendChild(teacherCell);

        tbody.appendChild(row);
      }

      if (!tbody.children.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="2" class="text-grey">
              No class information found.
            </td>
          </tr>
        `;
      }

    } catch (error) {

      console.error("Classes load error:", error);

      tbody.innerHTML = `
        <tr>
          <td colspan="2" class="text-grey">
            Couldn't load classes. Please refresh.
          </td>
        </tr>
      `;

    }
  }


  // LOAD ATTENDANCE

  async function loadAttendance(uid, classIds) {

    const container = document.getElementById("recentAttendance");

    try {

      const attendanceQuery = query(
        collection(db, "attendance"),
        where("studentId", "==", uid)
      );

      const snap = await getDocs(attendanceQuery);

      document.getElementById("statAttended").textContent = snap.size;

      if (snap.empty) {

        container.innerHTML = `
          <p class="text-grey" style="font-size:.88rem;">
            No attendance recorded yet.
          </p>
        `;

        await loadRateAndLive(classIds, 0);
        return;
      }

      const records = [];

      for (const attendanceDoc of snap.docs) {

        const attendance = attendanceDoc.data();

        if (!attendance.sessionId) continue;

        const sessionSnap = await getDoc(
          doc(db, "sessions", attendance.sessionId)
        );

        if (!sessionSnap.exists()) continue;

        const session = sessionSnap.data();

        const classData = await getClass(session.classId);

        records.push({
          className: classData?.className || "Class session",
          date: session.date?.toDate
            ? session.date.toDate()
            : null
        });

      }


      // SORT NEWEST FIRST

      records.sort((a, b) =>
        (b.date?.getTime() || 0) - (a.date?.getTime() || 0)
      );


      // RECENT ACTIVITY

      container.innerHTML = "";

      records.slice(0, 5).forEach(record => {

        const dateText = record.date
          ? record.date.toLocaleDateString("en-GB", {
              day: "numeric",
              month: "short",
              year: "numeric"
            })
          : "—";

        const item = document.createElement("div");
        item.className = "activity-item";

        const icon = document.createElement("div");
        icon.className = "activity-icon";
        icon.textContent = "✅";

        const details = document.createElement("div");

        const title = document.createElement("div");
        title.className = "activity-text";
        title.textContent = record.className;

        const date = document.createElement("div");
        date.className = "activity-time";
        date.textContent = dateText;

        details.appendChild(title);
        details.appendChild(date);

        item.appendChild(icon);
        item.appendChild(details);

        container.appendChild(item);

      });


      if (!records.length) {
        container.innerHTML = `
          <p class="text-grey" style="font-size:.88rem;">
            No attendance recorded yet.
          </p>
        `;
      }

      await loadRateAndLive(classIds, snap.size);

    } catch (error) {

      console.error("Attendance load error:", error);

      container.innerHTML = `
        <p class="text-grey" style="font-size:.88rem;">
          Attendance history isn't available yet.
        </p>
      `;

      document.getElementById("statAttended").textContent = "—";
      document.getElementById("statRate").textContent = "—";
      document.getElementById("statLive").textContent = "—";

    }

  }


  // ATTENDANCE RATE AND LIVE SESSION

  async function loadRateAndLive(classIds, attendedCount) {

    const rateEl = document.getElementById("statRate");
    const liveEl = document.getElementById("statLive");

    if (!classIds.length) {
      rateEl.textContent = "—";
      liveEl.textContent = "None";
      return;
    }

    try {

      let totalSessions = 0;
      let anyLive = false;

      for (let i = 0; i < classIds.length; i += 30) {

        const chunk = classIds.slice(i, i + 30);

        const sessionQuery = query(
          collection(db, "sessions"),
          where("classId", "in", chunk)
        );

        const sessionSnap = await getDocs(sessionQuery);

        totalSessions += sessionSnap.size;

        sessionSnap.forEach(sessionDoc => {
          if (sessionDoc.data().status === "active") {
            anyLive = true;
          }
        });

      }

      rateEl.textContent = totalSessions > 0
        ? Math.round((attendedCount / totalSessions) * 100) + "%"
        : "—";

      liveEl.textContent = anyLive ? "Live now" : "None";

    } catch (error) {

      console.error("Rate/live load error:", error);

      rateEl.textContent = "—";
      liveEl.textContent = "—";

    }

  }

</script>

</body>
</html>
