<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduMark — Login</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  /* Fallback styles in case style.css doesn't cover this page yet — remove if it does */
  :root {
    --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8;
    --text: #e2e8f0; --muted: #94a3b8; --error: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: var(--panel); border-radius: 16px; padding: 40px 32px;
    max-width: 380px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  .logo { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .logo span { color: var(--accent); }
  .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text); padding: 12px 14px; border-radius: 10px; font-size: 14px;
    margin-bottom: 16px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; background: var(--accent); color: #0f172a; border: none;
    padding: 13px; border-radius: 10px; font-weight: 600; font-size: 14px;
    cursor: pointer; margin-top: 6px;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button:hover:not(:disabled) { opacity: 0.9; }
  #status { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
  #status.error { color: var(--error); }
  #status.info { color: var(--muted); }
</style>
</head>
<body>

<div class="card">
  <div class="logo">Edu<span>Mark</span></div>
  <div class="subtitle">Sign in to your account</div>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username" />

    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password" />

    <button type="submit" id="loginBtn">Log in</button>
  </form>

  <div id="status"></div>
</div>

<script type="module">
  import { loginUser } from "/js/auth.js";

  const form = document.getElementById("loginForm");
  const loginBtn = document.getElementById("loginBtn");
  const statusEl = document.getElementById("status");

  function setStatus(msg, type = "info") {
    statusEl.textContent = msg;
    statusEl.className = type;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    loginBtn.disabled = true;
    setStatus("Signing in…", "info");

    try {
      // loginUser() handles the role lookup + redirect internally (see auth.js)
      await loginUser(email, password);
    } catch (err) {
      loginBtn.disabled = false;
      if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
        setStatus("Incorrect email or password.", "error");
      } else if (err.message === "User profile not found.") {
        setStatus("No role found for this account. Contact admin.", "error");
      } else {
        setStatus("Login failed: " + err.message, "error");
      }
    }
  });
</script>

</body>
</html>
